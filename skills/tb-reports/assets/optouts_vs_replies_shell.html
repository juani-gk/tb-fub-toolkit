<title>%%TITLE%%</title>
<style>
  :root { color-scheme: light; --tb-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; font-family: inherit; }
  html, body { font-family: var(--tb-font); }
  body {
    margin: 0;
    background: #f9f9f7;
    color: #1D1D1B;
  }
  @media print { html, body, table, th, td, * { font-family: var(--tb-font) !important; } }
  .page { max-width: 920px; margin: 0 auto; padding: 40px 24px 64px; }
  .tb-report {
    --surface-1:       #fcfcfb;
    --text-primary:    #1D1D1B;
    --text-secondary:  #4B5563;
    --text-muted:      #898781;
    --gridline:        #e1e0d9;
    --baseline:        #c3c2b7;
    --series-replies:  #ef7345;  /* TB chart-safe coral */
    --series-optouts:  #916700;  /* TB chart-safe gold */
    --border:          rgba(11,11,11,0.10);
  }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; color: var(--text-primary); }
  .subtitle { font-size: 14px; color: var(--text-secondary); margin: 0 0 28px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .stat-label { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 8px; }
  .stat-value { font-size: 30px; font-weight: 650; color: var(--text-primary); line-height: 1; font-variant-numeric: proportional-nums; }
  .stat-value .unit { font-size: 16px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
  .stat-note { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .swatch-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .chart-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin: 0 0 2px; }
  .chart-sub { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 18px; }
  .legend { display: flex; gap: 20px; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  svg { display: block; overflow: visible; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 11px; }
  .bar-replies { fill: var(--series-replies); transition: opacity 0.1s; }
  .bar-optouts { fill: var(--series-optouts); transition: opacity 0.1s; }
  .bar-replies.hover, .bar-optouts.hover { opacity: 0.78; }
  .hit-area { fill: transparent; cursor: pointer; }
  .tooltip {
    position: absolute; pointer-events: none; background: #1D1D1B; color: #fff;
    border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.5;
    opacity: 0; transform: translate(-50%, -100%); transition: opacity 0.1s;
    white-space: nowrap; z-index: 10;
  }
  .tooltip .t-date { color: #c3c2b7; margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; }
  .tooltip .t-row strong { font-variant-numeric: tabular-nums; }
  .chart-wrap { position: relative; }
  .footnote { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; margin-top: 4px; }
  .footnote strong { color: var(--text-primary); }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.data-table td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--gridline); }
  table.data-table th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
  table.data-table td { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  table.data-table td.num { text-align: right; }
  details.table-toggle summary { cursor: pointer; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
</style>
<div class="page tb-report">
  <h1>%%TITLE%%</h1>
  <p class="subtitle">%%SUBTITLE%%</p>

  <div class="kpi-row">
    <div class="stat-tile">
      <p class="stat-label"><span class="swatch-dot" style="background:#ef7345"></span>Replies (non opt-out)</p>
      <div class="stat-value">%%TOTAL_REPLIES%%</div>
    </div>
    <div class="stat-tile">
      <p class="stat-label"><span class="swatch-dot" style="background:#916700"></span>Opt-outs</p>
      <div class="stat-value">%%TOTAL_OPTOUTS%%</div>
    </div>
    <div class="stat-tile">
      <p class="stat-label">Opt-out share of repliers</p>
      <div class="stat-value">%%OPTOUT_SHARE%%<span class="unit">%</span></div>
      <p class="stat-note">%%BENCHMARK_NOTE%%</p>
    </div>
  </div>

  <div class="card">
    <p class="chart-title">Daily trend</p>
    <p class="chart-sub">Count of inbound messages per day, by type</p>
    <div class="legend">
      <div class="legend-item"><span class="legend-swatch" style="background:#ef7345"></span>Replies</div>
      <div class="legend-item"><span class="legend-swatch" style="background:#916700"></span>Opt-outs</div>
    </div>
    <div class="chart-wrap" id="chartWrap">
      <svg id="chart" viewBox="0 0 872 300" width="100%" height="300"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>

  <div class="card">
    <details class="table-toggle">
      <summary>View as table</summary>
      <table class="data-table" id="dataTable">
        <thead><tr><th>Date</th><th class="num">Replies</th><th class="num">Opt-outs</th></tr></thead>
        <tbody></tbody>
      </table>
    </details>
  </div>

  <p class="footnote"><strong>Methodology:</strong> %%METHODOLOGY%%</p>
</div>

<script>
// %%DAILY_DATA%% must be replaced with a JSON object:
// { "2026-08-01": {"replies": 0, "optouts": 1}, ... } - one entry per day
// in the window, zero-filled, keys sorted ascending.
const DAILY = %%DAILY_DATA%%;

const svg = document.getElementById('chart');
const tooltip = document.getElementById('tooltip');
const wrap = document.getElementById('chartWrap');
const tbody = document.querySelector('#dataTable tbody');

const W = 872, H = 300;
const padL = 32, padR = 16, padT = 12, padB = 34;
const plotW = W - padL - padR;
const plotH = H - padT - padB;

const dates = Object.keys(DAILY);
const n = dates.length;
const maxVal = Math.max(3, ...dates.map(d => Math.max(DAILY[d].replies, DAILY[d].optouts)));
const yMax = Math.ceil(maxVal);

const colW = plotW / n;
const barW = Math.min(10, colW * 0.32);
const barGap = 2;

function xCenter(i) { return padL + colW * (i + 0.5); }
function y(v) { return padT + plotH - (v / yMax) * plotH; }

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

const ticks = yMax <= 4 ? [0,1,2,3,4].filter(t=>t<=yMax) : [0, Math.round(yMax/2), yMax];
ticks.forEach(t => {
  svg.appendChild(svgEl('line', { class: 'gridline', x1: padL, x2: W - padR, y1: y(t), y2: y(t) }));
  const label = svgEl('text', { class: 'axis-label', x: padL - 8, y: y(t) + 4, 'text-anchor': 'end' });
  label.textContent = t;
  svg.appendChild(label);
});
svg.appendChild(svgEl('line', { class: 'baseline', x1: padL, x2: W - padR, y1: y(0), y2: y(0) }));

dates.forEach((d, i) => {
  if (i % 5 === 0 || i === n - 1) {
    const dt = new Date(d + 'T00:00:00Z');
    const label = svgEl('text', { class: 'axis-label', x: xCenter(i), y: H - 10, 'text-anchor': 'middle' });
    label.textContent = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
    svg.appendChild(label);
  }
});

function roundedBar(cx, val, cls, side) {
  const x0 = cx + side * (barGap / 2) + (side < 0 ? -barW : 0);
  const yTop = y(val);
  const h = plotH + padT - yTop;
  if (val === 0) {
    return svgEl('rect', { class: cls, x: x0, y: y(0) - 1.5, width: barW, height: 1.5, rx: 0.75 });
  }
  const r = 3;
  return svgEl('path', {
    class: cls,
    d: `M${x0},${yTop + r} a${r},${r} 0 0 1 ${r},${-r} h${barW - 2*r} a${r},${r} 0 0 1 ${r},${r} v${h - r} h${-barW} Z`
  });
}

const barEls = [];
dates.forEach((d, i) => {
  const cx = xCenter(i);
  const rBar = roundedBar(cx, DAILY[d].replies, 'bar-replies', -1);
  const oBar = roundedBar(cx, DAILY[d].optouts, 'bar-optouts', 1);
  svg.appendChild(rBar); svg.appendChild(oBar);
  barEls.push([rBar, oBar]);
});

dates.forEach((d, i) => {
  const hit = svgEl('rect', { class: 'hit-area', x: padL + colW * i, y: padT, width: colW, height: plotH });
  hit.addEventListener('pointerenter', () => showTooltip(i));
  hit.addEventListener('pointermove', () => showTooltip(i));
  hit.addEventListener('pointerleave', hideTooltip);
  hit.addEventListener('focus', () => showTooltip(i));
  hit.addEventListener('blur', hideTooltip);
  hit.setAttribute('tabindex', '0');
  svg.appendChild(hit);
});

function showTooltip(i) {
  barEls.forEach(([r, o], j) => { r.classList.toggle('hover', j === i); o.classList.toggle('hover', j === i); });
  const d = dates[i]; const v = DAILY[d];
  const dt = new Date(d + 'T00:00:00Z');
  const dateLabel = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  tooltip.innerHTML = '';
  const dateEl = document.createElement('div'); dateEl.className = 't-date'; dateEl.textContent = dateLabel;
  tooltip.appendChild(dateEl);
  [{label:'Replies',value:v.replies,color:'#ef7345'},{label:'Opt-outs',value:v.optouts,color:'#916700'}].forEach(r => {
    const row = document.createElement('div'); row.className = 't-row';
    const key = document.createElement('span');
    key.style.cssText = `display:inline-block;width:10px;height:10px;border-radius:2px;background:${r.color};`;
    const strong = document.createElement('strong'); strong.textContent = r.value;
    const label = document.createElement('span'); label.textContent = ' ' + r.label;
    row.appendChild(key); row.appendChild(strong); row.appendChild(label);
    tooltip.appendChild(row);
  });
  const svgRect = svg.getBoundingClientRect();
  const scale = svgRect.width / W;
  const px = xCenter(i) * scale;
  const topVal = Math.max(v.replies, v.optouts, 0.5);
  tooltip.style.left = px + 'px';
  tooltip.style.top = (y(topVal) * scale - 6) + 'px';
  tooltip.style.opacity = '1';
}
function hideTooltip() {
  tooltip.style.opacity = '0';
  barEls.forEach(([r, o]) => { r.classList.remove('hover'); o.classList.remove('hover'); });
}

dates.forEach(d => {
  const v = DAILY[d]; const tr = document.createElement('tr');
  const dt = new Date(d + 'T00:00:00Z');
  const dateLabel = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const tdDate = document.createElement('td'); tdDate.textContent = dateLabel;
  const tdR = document.createElement('td'); tdR.className = 'num'; tdR.textContent = v.replies;
  const tdO = document.createElement('td'); tdO.className = 'num'; tdO.textContent = v.optouts;
  tr.appendChild(tdDate); tr.appendChild(tdR); tr.appendChild(tdO);
  tbody.appendChild(tr);
});
</script>
